# One-off operational branch: this workflow is never merged into main.
name: Тест вечернего отчёта
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, send]
        default: inspect
      recipient:
        type: string
        required: true
      date:
        type: string
        required: true
      expected_user_id:
        type: string
        default: ''
      operation_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  test-report:
    name: Один вечерний отчёт одному получателю
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH с закреплённым ключом сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/known_hosts <<'HOSTS'
          193.8.215.89 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPs6iliVOxv+eE1haGiYlnu+BZ1jCImucjV8//Mmk5mq
          193.8.215.89 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAABBBF51PCAIT/no2I2VhfxmbUYxQqEBtdJqxfqHWpvr9Sy6OA7HXExxZXNkkZfhNgBodGC2iQ4cZHa2pxaC/bxOVfQ=
          HOSTS
      - name: Проверить привязку или отправить один тестовый отчёт
        env:
          MODE: ${{ inputs.mode }}
          RECIPIENT: ${{ inputs.recipient }}
          REPORT_DATE: ${{ inputs.date }}
          EXPECTED_USER_ID: ${{ inputs.expected_user_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "$MODE" == inspect || "$MODE" == send ]]
          [[ "$RECIPIENT" =~ ^@?[A-Za-z0-9_]{3,64}$ ]]
          [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ -z "$EXPECTED_USER_ID" || "$EXPECTED_USER_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9-]{8,100}$ ]]
          ssh -o BatchMode=yes -o ConnectTimeout=15 root@193.8.215.89 "cd /opt/kizuna/app && sudo -u kizuna env DOTENV_CONFIG_PATH=/opt/kizuna/.env node --input-type=module - '$MODE' '$RECIPIENT' '$REPORT_DATE' '$EXPECTED_USER_ID' '$OPERATION_ID'" < scripts/test-evening-report.mjs
