# Автодеплой: каждый пуш в main прогоняет юнит-тесты и выкладывает Кизуну на
# сервер тем же deploy.sh, что и с рабочей машины — один сценарий выкладки,
# два места запуска. Ключ деплоя лежит в секрете DEPLOY_SSH_KEY (его публичная
# половина — в authorized_keys сервера), host-ключи сервера зашиты здесь: они
# публичные, зато раннер не поверит подменённому серверу.
name: Деплой

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки не толкаются: вторая ждёт первую, а не летит параллельно.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Выкладка на сервер
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ключ деплоя и host-ключи сервера
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/known_hosts <<'HOSTS'
          193.8.215.89 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPs6iliVOxv+eE1haGiYlnu+BZ1jCImucjV8//Mmk5mq
          193.8.215.89 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBF51PCAIT/no2I2VhfxmbUYxQqEBtdJqxfqHWpvr9Sy6OA7HXExxZXNkkZfhNgBodGC2iQ4cZHa2pxaC/bxOVfQ=
          HOSTS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ./deploy.sh
