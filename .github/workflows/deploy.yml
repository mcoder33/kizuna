# Автодеплой: каждый пуш в main прогоняет юнит-тесты и выкладывает Кизуну на
# сервер тем же deploy.sh, что и с рабочей машины — один сценарий выкладки,
# два места запуска. Ключ деплоя лежит в секрете DEPLOY_SSH_KEY (его публичная
# половина — в authorized_keys сервера), host-ключи сервера зашиты здесь: они
# публичные, зато раннер не поверит подменённому серверу.
name: Деплой

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки не толкаются: вторая ждёт первую, а не летит параллельно.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  freshness:
    name: Проверка актуальности релиза
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: current
        name: Не выкладывать устаревший запуск
        run: |
          git fetch origin main --no-tags
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "Этот запуск соответствует текущему main ($GITHUB_SHA)."
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Пропуск: $GITHUB_SHA уже устарел относительно origin/main ($(git rev-parse origin/main))."
          fi

  deploy:
    name: Выкладка на сервер
    outputs:
      released_at: ${{ steps.deployed.outputs.released_at }}
    needs: [tests, freshness]
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ключ деплоя и host-ключи сервера
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/known_hosts <<'HOSTS'
          193.8.215.89 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPs6iliVOxv+eE1haGiYlnu+BZ1jCImucjV8//Mmk5mq
          193.8.215.89 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBF51PCAIT/no2I2VhfxmbUYxQqEBtdJqxfqHWpvr9Sy6OA7HXExxZXNkkZfhNgBodGC2iQ4cZHa2pxaC/bxOVfQ=
          HOSTS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ./deploy.sh
        env:
          KIZUNA_RELEASE_SHA: ${{ github.sha }}
      - id: deployed
        name: Время успешной выкладки
        run: echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  announce:
    name: Объявление релиза в Telegram
    needs: [tests, freshness, deploy]
    if: needs.freshness.outputs.current == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить изображение релиза
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let manifest = JSON.parse(fs.readFileSync('release-notes/latest.json', 'utf8'));
          if (!manifest.id || !manifest.title || !Array.isArray(manifest.changes)) {
            throw new Error('Некорректный release-notes/latest.json');
          }
          if (manifest.seasonalImage !== undefined && typeof manifest.seasonalImage !== 'boolean') {
            throw new Error('Некорректный seasonalImage');
          }
          if (manifest.seasonalImage && manifest.image) throw new Error('Выберите image или seasonalImage');
          (async () => {
            const { RELEASE_CARDS, applySeasonalDefault } = await import('./server/release-cards.js');
            manifest = applySeasonalDefault(manifest, true);
            const images = manifest.seasonalImage ? RELEASE_CARDS : (manifest.image ? [manifest.image] : []);
            const publicOrigins = new Set(['https://yourkizuna.com', 'https://kizuna.agent-hub.space']);
            for (const image of images) {
              const url = new URL(image);
              if (!publicOrigins.has(url.origin) || url.username || url.password) {
                throw new Error('Изображение релиза должно размещаться на публичном домене Кизуны');
              }
            }
            fs.writeFileSync('/tmp/kizuna-release-images.txt', images.join('\n'));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          while IFS= read -r image_url || [ -n "$image_url" ]; do
            [ -n "$image_url" ] || continue
            result=$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code} %{content_type}' "$image_url")
            [ "${result%% *}" = 200 ] && [[ "${result#* }" = image/* ]] || {
              echo "Картинка релиза недоступна или имеет неверный MIME type: $result" >&2
              exit 1
            }
          done < /tmp/kizuna-release-images.txt
      - name: Ключ деплоя и host-ключи сервера
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/known_hosts <<'HOSTS'
          193.8.215.89 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPs6iliVOxv+eE1haGiYlnu+BZ1jCImucjV8//Mmk5mq
          193.8.215.89 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBF51PCAIT/no2I2VhfxmbUYxQqEBtdJqxfqHWpvr9Sy6OA7HXExxZXNkkZfhNgBodGC2iQ4cZHa2pxaC/bxOVfQ=
          HOSTS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Объявить только проверенный выложенный релиз
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DATE: ${{ needs.deploy.outputs.released_at }}
        run: |
          ssh root@193.8.215.89 "bash -s -- '$RELEASE_SHA' '$RELEASE_DATE'" <<'REMOTE_ANNOUNCE'
          set -euo pipefail
          expected="$1"
          released_at="$2"
          actual=$(cat /opt/kizuna/.deployed-sha)
          if [ "$actual" != "$expected" ]; then
            echo "Пропуск объявления: выложен SHA $actual, ожидался $expected" >&2
            exit 1
          fi
          cd /opt/kizuna/app
          sudo -u kizuna env DOTENV_CONFIG_PATH=/opt/kizuna/.env node scripts/announce-release.mjs --send --seasonal-default --release-sha "$expected" --release-date "$released_at"
          REMOTE_ANNOUNCE
